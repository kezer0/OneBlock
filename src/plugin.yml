name:  Oneblock
main:  oneblock.OneBlock
version:  1.6.2
api-version: 1.13
author:  MrMarL
depend: ['NetworkCore']
softdepend: ['Vault', 'EternalEconomy', 'PlaceholderAPI', 'WorldGuard', 'ItemsAdder', 'Oraxen', 'Nexo', 'CraftEngine']

commands:
  island:
    description: OneBlock main command.
    aliases: is
    usage: Are you using the command incorrectly?
  spawn:
    description: Teleports to spawn.
    usage: Use /spawn to teleport to spawn

permissions:
    oneblock.set:
        description: Access to admin commands and settings
        default: op
    oneblock.join:
        description: Main permission
        default: true
    oneblock.invite:
        description: Allows you to invite other players to your island to play together
        default: true
    oneblock.kick:
        description: Allows the island owner to kick members and visitors from their island
        default: true
    oneblock.visit:
        description: Allows visiting other players islands
        default: true
    oneblock.ignoreBarrier:
        description: Allows bypassing island barriers and restrictions
        default: op
    oneblock.idreset:
        description: Allows resetting your island ID
        default: op
    oneblock.allow_visit:
        description: Allow players to open their island for visitors
        default: op